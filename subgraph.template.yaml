specVersion: 0.0.4
description: Instance Deployer Subgraph
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: InstanceDeployer
    network: {{ network }}
    source:
      address: "{{ address }}"
      abi: InstanceDeployer
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - SystemInstance
      abis:
        - name: InstanceDeployer
          file: ./abis/InstanceDeployer.json
      eventHandlers:
        - event: SystemInstanceCreated(indexed address,indexed address,indexed address,uint256)
          handler: handleSystemInstanceCreated
      file: ./src/mapping.ts
